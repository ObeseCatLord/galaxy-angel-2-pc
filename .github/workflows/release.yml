# Release builds: Linux x86-64 and ARM64 (on Ubuntu 20.04, so they run on
# distributions with glibc 2.31 and later) and Windows x86-64 (cross-compiled
# with llvm-mingw). The builds need private inputs: secret GA2_PRIVATE_REPO
# (owner/name), read with the deploy key in secret GA2_PRIVATE_DEPLOY_KEY
# (tools/ci/fetch-private.sh). Language packs found in release-mods/ ship in
# each build's mods/ folder. The archives are attached to the release named
# by the tag input (which must exist, as a draft or published). Then the
# installer workflow (installer.yml) adds the installer and updater to each
# archive and attaches it, ga2-manifest.json and the final SHA256SUMS.txt.
name: Release builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. v0.9.0)
        required: true

# One release build at a time (a second one queues instead of running twice).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:20.04
    timeout-minutes: 360
    env:
      GA2_PRIVATE_ROOT: ${{ github.workspace }}/private
      NAME: galaxy-angel-2-pc-${{ inputs.tag }}-linux-${{ matrix.arch }}
    steps:
      - name: Git
        run: apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -y -q git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: tools/ci/deps-ubuntu.sh release
      - name: Private inputs
        env:
          GA2_PRIVATE_REPO: ${{ secrets.GA2_PRIVATE_REPO }}
          GA2_PRIVATE_DEPLOY_KEY: ${{ secrets.GA2_PRIVATE_DEPLOY_KEY }}
        run: tools/ci/fetch-private.sh "$GA2_PRIVATE_ROOT"
      - name: Build
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          git config --global --add safe.directory '*'
          export GA2_PACKAGE_MODS="$(find "$GA2_PRIVATE_ROOT/release-mods" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | paste -sd:)"
          tools/ci/build-linux-release.sh "dist/$NAME"
          tar -C dist -cJf "$NAME.tar.xz" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.NAME }}.tar.xz
          retention-days: 7

  windows:
    name: Windows x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GA2_PRIVATE_ROOT: ${{ github.workspace }}/private
      NAME: galaxy-angel-2-pc-${{ inputs.tag }}-windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo tools/ci/deps-ubuntu.sh ci
          # llvm-mingw: clang, libc++ and current mingw-w64 headers (Ubuntu's are too old).
          curl -sSfL https://github.com/mstorsjo/llvm-mingw/releases/download/20250114/llvm-mingw-20250114-ucrt-ubuntu-20.04-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "GA2_LLVM_MINGW=$RUNNER_TEMP/llvm-mingw-20250114-ucrt-ubuntu-20.04-x86_64" >> "$GITHUB_ENV"
      - name: Private inputs
        env:
          GA2_PRIVATE_REPO: ${{ secrets.GA2_PRIVATE_REPO }}
          GA2_PRIVATE_DEPLOY_KEY: ${{ secrets.GA2_PRIVATE_DEPLOY_KEY }}
        run: tools/ci/fetch-private.sh "$GA2_PRIVATE_ROOT"
      - name: Build
        run: |
          git config --global user.name ci && git config --global user.email ci@localhost
          export GA2_PACKAGE_MODS="$(find "$GA2_PRIVATE_ROOT/release-mods" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | paste -sd:)"
          tools/ci/build-windows-release.sh "dist/$NAME"
          (cd dist && zip -qr "../$NAME.zip" "$NAME")
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.NAME }}.zip
          retention-days: 7

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts && mv */* . && sha256sum galaxy-angel-2-pc-* > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "${{ inputs.tag }}" galaxy-angel-2-pc-* SHA256SUMS.txt --clobber --repo "${{ github.repository }}"

  installer:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/installer.yml
    with:
      tag: ${{ inputs.tag }}
